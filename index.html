<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Drop</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #FFF9C4 100%);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #game {
    width: 100%;
    max-width: 500px;
    height: 100%;
    position: relative;
    background: rgba(255,255,255,0.15);
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    font-weight: bold;
    color: #1a1a1a;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    z-index: 10;
  }
  .question {
    position: absolute;
    background: #FFEB3B;
    border: 5px solid #FF9800;
    border-radius: 20px;
    padding: 14px 22px;
    font-size: 32px;
    font-weight: bold;
    color: #333;
    box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    text-align: center;
    min-width: 140px;
    transition: background 0.2s;
  }
  .question.correct {
    background: #4CAF50;
    color: white;
    border-color: #2E7D32;
  }
  #answers {
    position: absolute;
    bottom: 24px;
    left: 12px;
    right: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    z-index: 10;
  }
  button.answer {
    padding: 22px 10px;
    font-size: 32px;
    font-weight: bold;
    border: none;
    border-radius: 18px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 0 #2E7D32;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  button.answer:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 #2E7D32;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #overlay h1 { font-size: 52px; margin-bottom: 16px; }
  #overlay p { font-size: 26px; line-height: 1.5; }
  .big-btn {
    margin-top: 32px;
    padding: 18px 48px;
    font-size: 26px;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    background: #FF5722;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 0 #E64A19;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: none; }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div>Skor: <span id="score">0</span></div>
    <div>Level: <span id="level">1</span></div>
    <div>Nyawa: <span id="lives">❤️❤️❤️</span></div>
  </div>
  <div id="questionsContainer"></div>
  <div id="answers"></div>
  <div id="overlay">
    <h1 id="overlayTitle">Math Drop</h1>
    <p id="overlayText">Jawab soalan sebelum sampai ke bawah!</p>
    <button class="big-btn" id="actionBtn">Mula Main</button>
  </div>
</div>

<script>
// ========== VARIABLES ==========
const questionsContainer = document.getElementById('questionsContainer');
const answersEl = document.getElementById('answers');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const actionBtn = document.getElementById('actionBtn');

let score = 0;
let level = 1;
let lives = 3;
let correctCount = 0;
let speed = 1.4;
let gameRunning = false;
let spawnTimer = null;
let activeQuestions = [];

// ========== AUDIO ==========
function playSound(frequency, type = 'sine', duration = 0.12) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(frequency, ctx.currentTime);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}

// ========== QUESTION GENERATOR ==========
function generateQuestion() {
  let a, b, answer, text, operator;

  if (level <= 3) {
    // Tambah & Tolak, nombor 1-10
    a = Math.floor(Math.random() * 10) + 1;
    b = Math.floor(Math.random() * 10) + 1;
    operator = Math.random() > 0.5 ? '+' : '-';
  } else if (level <= 6) {
    // Tambah & Tolak, nombor 1-20
    a = Math.floor(Math.random() * 20) + 1;
    b = Math.floor(Math.random() * 20) + 1;
    operator = Math.random() > 0.5 ? '+' : '-';
  } else {
    // Tambah, Tolak, Darab
    const ops = ['+', '-', '×'];
    operator = ops[Math.floor(Math.random() * ops.length)];
    if (operator === '×') {
      a = Math.floor(Math.random() * 10) + 1;
      b = Math.floor(Math.random() * 10) + 1;
    } else {
      a = Math.floor(Math.random() * 15) + 1;
      b = Math.floor(Math.random() * 15) + 1;
    }
  }

  if (operator === '+') {
    answer = a + b;
    text = `${a} + ${b}`;
  } else if (operator === '-') {
    if (a < b) [a, b] = [b, a];
    answer = a - b;
    text = `${a} - ${b}`;
  } else {
    answer = a * b;
    text = `${a} × ${b}`;
  }

  return { text, answer };
}

// ========== SPAWN QUESTION ==========
function spawnQuestion() {
  if (!gameRunning) return;

  const q = generateQuestion();
  const el = document.createElement('div');
  el.className = 'question';
  el.textContent = q.text;
  el.style.left = (Math.random() * 55 + 8) + '%';
  el.style.top = '-80px';
  questionsContainer.appendChild(el);

  const questionObj = {
    el,
    answer: q.answer,
    y: -80,
    answered: false
  };
  activeQuestions.push(questionObj);

  // Generate answer buttons
  generateAnswerButtons(q.answer);

  animateQuestion(questionObj);
}

function generateAnswerButtons(correct) {
  const options = new Set([correct]);
  let attempts = 0;
  while (options.size < 4 && attempts < 20) {
    const offset = Math.floor(Math.random() * 9) - 4; // -4 to +4
    if (offset !== 0) options.add(correct + offset);
    attempts++;
  }
  // Fallback if not enough
  while (options.size < 4) {
    options.add(correct + options.size);
  }

  const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
  answersEl.innerHTML = '';

  shuffled.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt, correct);
    answersEl.appendChild(btn);
  });
}

// ========== ANIMATION ==========
function animateQuestion(qObj) {
  function move() {
    if (!gameRunning || qObj.answered || !qObj.el.parentNode) return;

    qObj.y += speed;
    qObj.el.style.top = qObj.y + 'px';

    if (qObj.y > window.innerHeight - 160) {
      // Missed
      missQuestion(qObj);
      return;
    }
    requestAnimationFrame(move);
  }
  requestAnimationFrame(move);
}

// ========== ANSWER HANDLING ==========
function handleAnswer(chosen, correct) {
  if (!gameRunning) return;

  // Find the current falling question (latest one)
  const current = activeQuestions.find(q => !q.answered);
  if (!current) return;

  if (chosen === correct) {
    // Correct
    current.answered = true;
    current.el.classList.add('correct');
    score += 10 * level;
    correctCount++;
    scoreEl.textContent = score;
    playSound(880, 'sine', 0.1);

    setTimeout(() => {
      if (current.el.parentNode) current.el.remove();
    }, 250);

    // Level up every 10 correct
    if (correctCount >= 10) {
      correctCount = 0;
      level++;
      levelEl.textContent = level;
      speed = 1.4 + (level - 1) * 0.35;
      playSound(523, 'triangle', 0.2);
    }
  } else {
    // Wrong
    playSound(180, 'square', 0.25);
    loseLife();
  }

  // Remove from active
  activeQuestions = activeQuestions.filter(q => q !== current);
}

function missQuestion(qObj) {
  qObj.answered = true;
  if (qObj.el.parentNode) qObj.el.remove();
  activeQuestions = activeQuestions.filter(q => q !== qObj);
  playSound(150, 'sawtooth', 0.3);
  loseLife();
}

function loseLife() {
  lives--;
  updateLives();
  if (lives <= 0) {
    endGame();
  }
}

function updateLives() {
  livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
}

// ========== GAME CONTROL ==========
function startGame() {
  // Reset
  score = 0;
  level = 1;
  lives = 3;
  correctCount = 0;
  speed = 1.4;
  activeQuestions.forEach(q => q.el.remove());
  activeQuestions = [];
  questionsContainer.innerHTML = '';
  answersEl.innerHTML = '';

  scoreEl.textContent = '0';
  levelEl.textContent = '1';
  updateLives();

  overlay.style.display = 'none';
  gameRunning = true;

  // Spawn first question immediately
  spawnQuestion();
  // Then every 2.2 seconds
  spawnTimer = setInterval(spawnQuestion, 2200);
}

function endGame() {
  gameRunning = false;
  clearInterval(spawnTimer);

  const highScore = parseInt(localStorage.getItem('mathdrop-highscore') || '0');
  if (score > highScore) {
    localStorage.setItem('mathdrop-highscore', score);
  }

  overlayTitle.textContent = 'Game Over';
  overlayText.innerHTML = `Skor kamu: <b>\( {score}</b><br>High Score: <b> \){Math.max(score, highScore)}</b>`;
  actionBtn.textContent = 'Main Semula';
  overlay.style.display = 'flex';
  playSound(120, 'sawtooth', 0.5);
}

// ========== EVENT ==========
actionBtn.addEventListener('click', startGame);

// Initial screen
overlay.style.display = 'flex';
</script>
</body>
</html>
